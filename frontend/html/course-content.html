<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Content · Card Catalog</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="course-content">
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-row">
        <a href="index.html" class="brand">
          <span class="mark">SCMS</span>
          <span class="name">Card Catalog</span>
        </a>
        <span class="tagline">STUDENT COURSE MANAGEMENT &amp; PROGRESS LEDGER</span>
      </div>
      <nav id="site-nav" aria-label="Primary"></nav>
    </div>
  </header>

  <main>
    <div id="course-content-container">
      <div class="page-header">
        <span class="page-eyebrow">Module 4 &middot; Learning Management</span>
        <h1 id="course-content-title">Course</h1>
        <p class="mono" id="course-content-progress">0% complete</p>
        <div class="progress-bar"><div class="progress-bar-fill" id="course-progress-fill" style="width:0%"></div></div>
      </div>

      <div class="section-heading"><h2>Modules</h2></div>
      <ul class="module-list" id="module-list"></ul>

      <div class="hero-actions" style="margin-top:24px;">
        <a id="materials-link" class="btn-ghost" href="#">View Materials</a>
        <a id="certificate-link" class="btn-ghost" href="#">View Certificate</a>
      </div>
    </div>

  </main>
  <footer class="site-footer">
    <p>&copy; 2026 Card Catalog &mdash; Student Course Management &amp; Learning Progress Tracking System</p>
  </footer>

  <script src="../js/app.js"></script>

</body>
</html>
