<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password · Card Catalog</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="forgot-password">
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-row">
        <a href="index.html" class="brand">
          <span class="mark">SCMS</span>
          <span class="name">Card Catalog</span>
        </a>
        <span class="tagline">STUDENT COURSE MANAGEMENT &amp; PROGRESS LEDGER</span>
      </div>
      <nav id="site-nav" aria-label="Primary"></nav>
    </div>
  </header>

  <main>
    <div class="page-header narrow">
      <span class="page-eyebrow">Module 1 &middot; User Authentication</span>
      <h1>Reset your password</h1>
      <p>Enter the email on your account and we'll confirm your identity.</p>
    </div>
    <div class="card-form narrow">
      <form id="forgot-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div id="form-message" class="form-message" hidden></div>
        <button type="submit" class="btn btn-full">Send Reset Link</button>
        <p class="form-footnote"><a href="login.html">Back to log in</a></p>
      </form>
    </div>

  </main>
  <footer class="site-footer">
    <p>&copy; 2026 Card Catalog &mdash; Student Course Management &amp; Learning Progress Tracking System</p>
  </footer>

  <script src="../js/app.js"></script>

</body>
</html>
